services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - ./server/.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data/data.db:/app/data.db

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
