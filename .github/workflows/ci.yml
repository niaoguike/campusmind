name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  api:
    name: API checks and teacher portal tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: campusmind
          POSTGRES_PASSWORD: campusmind
          POSTGRES_DB: campusmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusmind -d campusmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://campusmind:campusmind@127.0.0.1:5432/campusmind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Enable pgvector
        run: PGPASSWORD=campusmind psql -h 127.0.0.1 -U campusmind -d campusmind -c 'CREATE EXTENSION IF NOT EXISTS vector'
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Syntax checks
        working-directory: server
        run: |
          node --check index.js
          node --check db/database.js
          node --check db/migrate.js
          node --check tests/teacher-portal.mjs
      - name: Teacher portal API tests
        working-directory: server
        env:
          NODE_ENV: test
        run: npm run test:api
