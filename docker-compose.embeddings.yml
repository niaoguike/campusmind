# Optional local-only embeddings; independent from the application containers.
services:
  embeddings:
    # Verified Ollama 0.40.6; override explicitly when testing an upgrade.
    image: ${OLLAMA_IMAGE:-ollama/ollama@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_KEEP_ALIVE: 10m
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - campusmind-ollama:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  campusmind-ollama:
